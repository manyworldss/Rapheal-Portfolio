<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapheal Suber — Archive</title>
<script>
  (function(){ try { var t = localStorage.getItem('rs-theme'); document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark'; } catch(e){} })();
</script>
<link rel="stylesheet" href="./styles.css">
<style>
  html, body { background: var(--bg); }
  #root { position: relative; }
  /* Burned-edge vignette — darkens the corners for cinematic contrast.
     Sits above page content but below nav, overlays, and the intro curtain. */
  .vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 200;
    box-shadow: inset 0 0 clamp(70px, 12vw, 220px) rgba(23, 20, 15, 0.13);
    background: radial-gradient(135% 125% at 50% 42%, transparent 56%, rgba(23, 20, 15, 0.12) 100%);
    transition: box-shadow var(--dur-4) var(--ease-soft), background var(--dur-4) var(--ease-soft);
  }
  [data-theme="dark"] .vignette {
    box-shadow: inset 0 0 clamp(90px, 15vw, 300px) rgba(0, 0, 0, 0.66);
    background: radial-gradient(135% 125% at 50% 42%, transparent 46%, rgba(0, 0, 0, 0.58) 100%);
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="helpers.jsx"></script>
<script type="text/babel" src="sections.jsx"></script>
<script type="text/babel" src="atmosphere.jsx"></script>
<script type="text/babel" src="overlays.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
