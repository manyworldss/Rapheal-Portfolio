<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prox · iOS Onboarding Interactive Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100vh; background: #0c2014; font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif; overflow-x: hidden; }
    #root { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel">

// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});

  </script>

  <script type="text/babel">
// ProxComponents.jsx — Brand-correct reusable Prox UI primitives
// Sourced from manyworldss/mobile_app (production codebase):
//   - Nunito font, 900 weight headings
//   - #175C43 primary forest, #0FB872 bright savings, #F2CF58 yellow accent
//   - #F4EBDD cream backgrounds, white cards with shadow-sm + #d4cec6 borders
//   - Pill-shaped buttons (rounded-full, h-12) and pill-shaped form fields
// All assets reference ../../public/* (imported from production repo)

const R = (typeof window !== 'undefined' && window.__resources) || {};
const ASSETS = {
  logo: R.proxLogo || '../../public/Icon-01.png',
  produce: R.proxProduce || '../../public/produce_background.jpg',
  cartFinder: '../../public/cart_finder.png',
  cartResult: '../../public/cart_result.png',
  deal: '../../public/deal.png',
  flame: '../../public/flame.png',
  pantry: '../../public/pantry.png',
  user: '../../public/user.png',
  location: '../../public/location.png',
  store: '../../public/store.png',
};
window.PROX_ASSETS = ASSETS;

// ─────────────────────────────────────────────────────────────
// LOGO — uses the real Prox Icon-01.png
// ─────────────────────────────────────────────────────────────
function ProxLogo({ size = 96, frame = false, frameColor = '#F2CF58' }) {
  const img = (
    <img
      src={ASSETS.logo}
      alt="Prox"
      style={{
        width: size, height: size,
        objectFit: 'contain', display: 'block',
      }}
      draggable={false}
    />
  );
  if (!frame) return img;
  return (
    <div style={{
      background: frameColor,
      borderRadius: 18,
      padding: 12,
      display: 'inline-flex',
      alignItems: 'center', justifyContent: 'center',
    }}>{img}</div>
  );
}

// ─────────────────────────────────────────────────────────────
// BUTTONS — pill-shaped, h-12, Nunito 700
// ─────────────────────────────────────────────────────────────
function PrimaryButton({ children, onClick, disabled = false, style = {} }) {
  const [pressed, setPressed] = React.useState(false);
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      onPointerDown={() => setPressed(true)}
      onPointerUp={() => setPressed(false)}
      onPointerLeave={() => setPressed(false)}
      style={{
        width: '100%',
        height: 48,
        borderRadius: 9999,
        background: disabled ? '#7a8c84' : '#175C43',
        color: '#fff',
        fontFamily: 'Nunito, system-ui, sans-serif',
        fontSize: 15, fontWeight: 700,
        border: 'none',
        cursor: disabled ? 'not-allowed' : 'pointer',
        transition: 'transform 120ms ease, background 120ms ease, opacity 200ms ease',
        transform: pressed ? 'scale(0.98)' : 'scale(1)',
        opacity: disabled ? 0.55 : 1,
        ...style,
      }}
    >
      {children}
    </button>
  );
}

// Bright savings variant (used on SavingsOnboarding "Start Saving!" + intro CTA)
function BrightButton({ children, onClick, disabled = false, style = {} }) {
  const [pressed, setPressed] = React.useState(false);
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      onPointerDown={() => setPressed(true)}
      onPointerUp={() => setPressed(false)}
      onPointerLeave={() => setPressed(false)}
      style={{
        width: '100%', height: 52,
        borderRadius: 9999,
        background: disabled ? '#7a8c84' : '#0FB872',
        color: '#fff',
        fontFamily: 'Nunito, system-ui, sans-serif',
        fontSize: 16, fontWeight: 700,
        border: 'none',
        cursor: disabled ? 'not-allowed' : 'pointer',
        transition: 'transform 120ms ease',
        transform: pressed ? 'scale(0.98)' : 'scale(1)',
        opacity: disabled ? 0.55 : 1,
        ...style,
      }}
    >
      {children}
    </button>
  );
}

// Outline secondary button — used on Welcome ("Sign In") + neutral actions
function OutlineButton({ children, onClick, style = {} }) {
  return (
    <button
      onClick={onClick}
      style={{
        width: '100%', height: 48,
        borderRadius: 9999,
        background: 'transparent',
        color: '#175C43',
        fontFamily: 'Nunito, system-ui, sans-serif',
        fontSize: 15, fontWeight: 700,
        border: '1.5px solid #175C43',
        cursor: 'pointer',
        transition: 'background 120ms ease, color 120ms ease',
        ...style,
      }}
    >
      {children}
    </button>
  );
}

// Tinted/neutral pill ("Continue as Guest" + OAuth wrapper)
function NeutralButton({ children, onClick, style = {} }) {
  return (
    <button
      onClick={onClick}
      style={{
        width: '100%', height: 48,
        borderRadius: 9999,
        background: '#FAF7F2',
        color: '#211B16',
        fontFamily: 'Nunito, system-ui, sans-serif',
        fontSize: 15, fontWeight: 600,
        border: '1px solid #d4cec6',
        cursor: 'pointer',
        display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
        transition: 'background 120ms ease',
        whiteSpace: 'nowrap',
        ...style,
      }}
    >
      {children}
    </button>
  );
}

function GhostLink({ children, onClick, style = {} }) {
  return (
    <button
      onClick={onClick}
      style={{
        background: 'transparent', border: 'none',
        color: 'rgba(33, 27, 22, 0.55)',
        fontFamily: 'Nunito, system-ui, sans-serif',
        fontSize: 13, fontWeight: 600,
        cursor: 'pointer', padding: '8px 4px',
        textAlign: 'center', whiteSpace: 'nowrap',
        ...style,
      }}
    >{children}</button>
  );
}

// ─────────────────────────────────────────────────────────────
// CHROME
// ─────────────────────────────────────────────────────────────
function BackChevron({ onClick, color = '#211B16' }) {
  return (
    <button
      onClick={onClick}
      aria-label="Back"
      style={{
        display: 'inline-flex', alignItems: 'center', gap: 6,
        background: 'transparent', border: 'none',
        cursor: 'pointer', padding: '6px 4px',
        color, fontFamily: 'Nunito, system-ui, sans-serif',
        fontSize: 14, fontWeight: 600,
      }}
    >

// ─────────────────────────────────────────────────────────────
// COUNT-UP HOOK — animates a numeric target with cubic easing
// ─────────────────────────────────────────────────────────────
function useCountUp(target, { duration = 700 } = {}) {
  const [val, setVal] = React.useState(target);
  const fromRef = React.useRef(target);
  React.useEffect(() => {
    const from = fromRef.current;
    if (from === target) return;
    const start = performance.now();
    let raf;
    const tick = (t) => {
      const p = Math.min(1, (t - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3); // ease-out cubic
      const v = from + (target - from) * eased;
      setVal(v);
      if (p < 1) raf = requestAnimationFrame(tick);
      else fromRef.current = target;
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target, duration]);
  return val;
}
window.useCountUp = useCountUp;

// ─────────────────────────────────────────────────────────────
// CONFETTI — short celebratory burst from top-center
// ─────────────────────────────────────────────────────────────
function Confetti({ duration = 2400, count = 42 }) {
  const [pieces] = React.useState(() => {
    // Deterministic seed per mount so React keys are stable
    return Array.from({ length: count }).map((_, i) => {
      const colors = ['#0FB872', '#175C43', '#F2CF58', '#F5C218', '#D7EFE3'];
      const left = 50 + (Math.random() - 0.5) * 90;       // -45% to +45% of width
      const drift = (Math.random() - 0.5) * 80;
      const delay = Math.random() * 350;
      const dur = duration - 200 + Math.random() * 400;
      const w = 6 + Math.random() * 4;
      const h = 9 + Math.random() * 6;
      const rotStart = Math.random() * 360;
      const rotEnd = rotStart + (Math.random() * 720 - 360);
      const color = colors[i % colors.length];
      const shape = Math.random() < 0.3 ? 'circle' : 'rect';
      return { id: i, left, drift, delay, dur, w, h, rotStart, rotEnd, color, shape };
    });
  });

  return (
    <div aria-hidden style={{
      position: 'absolute', inset: 0, overflow: 'hidden',
      pointerEvents: 'none', zIndex: 10,
    }}>
      {pieces.map(p => (
        <span key={p.id} style={{
          position: 'absolute',
          top: -20, left: `${p.left}%`,
          width: p.w, height: p.shape === 'circle' ? p.w : p.h,
          background: p.color,
          borderRadius: p.shape === 'circle' ? 999 : 1,
          opacity: 0,
          transform: `translate(0,0) rotate(${p.rotStart}deg)`,
          animation: `proxConfettiFall ${p.dur}ms cubic-bezier(.25,.8,.4,1) ${p.delay}ms forwards`,
          // CSS custom props consumed by the keyframes
          '--prox-confetti-drift': `${p.drift}px`,
          '--prox-confetti-rot-end': `${p.rotEnd}deg`,
        }}/>
      ))}
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// SCREEN 04 — VERIFY EMAIL (NEW — founder ask)
//   6-digit OTP. Personalized "Hi {name}, check your inbox"
//   Paste-friendly, auto-advance, resend, "wrong email" escape.
// ─────────────────────────────────────────────────────────────
function Screen3_VerifyEmail({ onBack, onVerified, email = 'you@example.com', firstName = '' }) {
  const len = 6;
  const [digits, setDigits] = React.useState(Array(len).fill(''));
  const [error, setError] = React.useState(false);
  const [resending, setResending] = React.useState(false);
  const refs = React.useRef([]);
  const filled = digits.every(d => d.length > 0);

  React.useEffect(() => { refs.current[0]?.focus(); }, []);

  const setDigit = (i, v) => {
    const c = (v || '').slice(-1).replace(/[^0-9]/g, '');
    const next = [...digits];
    next[i] = c;
    setDigits(next);
    setError(false);
    if (c && i < len - 1) refs.current[i + 1]?.focus();
  };
  const onKeyDown = (i, e) => {
    if (e.key === 'Backspace' && !digits[i] && i > 0) {
      refs.current[i - 1]?.focus();
    }
  };
  const onPaste = (e) => {
    const text = (e.clipboardData.getData('text') || '').replace(/[^0-9]/g, '').slice(0, len);
    if (text.length) {
      e.preventDefault();
      setDigits(Array(len).fill('').map((_, i) => text[i] || ''));
      refs.current[Math.min(text.length, len) - 1]?.focus();
    }
  };

  const verify = () => {
    if (digits.join('') === '000000') { setError(true); return; }
    onVerified?.(digits.join(''));
  };

  return (
    <ScreenShell bg="#F4EBDD">
      <div style={{
        flex: 1, display: 'flex', flexDirection: 'column',
        padding: '68px 22px 0',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <BackChevron onClick={onBack}/>
          <div style={{ width: 60 }}/>
          <div style={{ width: 60 }}/>
        </div>

        <div style={{ flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
        <div style={{ textAlign: 'center' }}>
          {/* email-in-circle visual */}
          <div style={{
            width: 64, height: 64, borderRadius: 999,
            background: '#F2CF58',
            display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
            marginBottom: 16,
          }}>
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#175C43" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="3"/>
              <path d="m3 8 9 6 9-6"/>
            </svg>
          </div>
          <h1 style={{
            fontFamily: 'Nunito, system-ui, sans-serif',
            fontSize: 24, fontWeight: 900, color: '#211B16',
            margin: 0, lineHeight: 1.15, letterSpacing: '-0.01em',
          }}>{firstName ? `Hi ${firstName}, check your inbox.` : 'Check your inbox.'}</h1>
          <p style={{
            fontFamily: 'Nunito, system-ui, sans-serif',
            fontSize: 13, color: 'rgba(33,27,22,0.6)', fontWeight: 500,
            margin: '6px auto 0', lineHeight: 1.4, maxWidth: 280,
          }}>
            We sent a 6-digit code to <strong style={{ color: '#211B16', fontWeight: 800 }}>{email}</strong>.
          </p>
        </div>

        <div style={{
          marginTop: 24,
          display: 'grid', gridTemplateColumns: 'repeat(6, 1fr)', gap: 8,
        }} onPaste={onPaste}>
          {digits.map((d, i) => (
            <input
              key={i}
              ref={el => refs.current[i] = el}
              inputMode="numeric"
              maxLength={1}
              value={d}
              onChange={(e) => setDigit(i, e.target.value)}
              onKeyDown={(e) => onKeyDown(i, e)}
              style={{
                height: 52,
                background: '#fff',
                border: error
                  ? '1.5px solid #E5484D'
                  : (d ? '1.5px solid #175C43' : '1.5px solid #d4cec6'),
                borderRadius: 14,
                fontFamily: 'Nunito, system-ui, sans-serif',
                fontSize: 22, fontWeight: 900, color: '#211B16',
                textAlign: 'center', outline: 'none', minWidth: 0, padding: 0,
                transition: 'border-color 120ms ease',
              }}
            />
          ))}
        </div>

        {error && (
          <div style={{
            marginTop: 10,
            fontFamily: 'Nunito, system-ui, sans-serif',
            fontSize: 12, color: '#E5484D', fontWeight: 700, textAlign: 'center',
          }}>That code didn't match. Try again or resend below.</div>
        )}

        <div style={{
          marginTop: 18, textAlign: 'center',
          fontFamily: 'Nunito, system-ui, sans-serif',
          fontSize: 13, color: 'rgba(33,27,22,0.55)', fontWeight: 500,
        }}>
          Didn't get it?{' '}
          <button
            onClick={() => { setResending(true); setTimeout(() => setResending(false), 1200); }}
            style={{
              background: 'transparent', border: 'none', padding: 0, cursor: 'pointer',
              color: '#175C43', fontWeight: 800, fontSize: 13,
              fontFamily: 'Nunito, system-ui, sans-serif',
              textDecoration: 'underline', textUnderlineOffset: 2,
            }}
          >{resending ? 'Sending…' : 'Resend code'}</button>
        </div>

        </div>

        <div style={{ padding: '10px 0 16px' }}>
          <PrimaryButton onClick={verify} disabled={!filled}>Verify email</PrimaryButton>
          <div style={{ display: 'flex', justifyContent: 'center', marginTop: 4 }}>
            <GhostLink onClick={onBack}>Wrong email? Edit it</GhostLink>
          </div>
        </div>
      </div>
    </ScreenShell>
  );
}

function Screen5_FeatureReveal({ onContinue, onBack }) {
  const features = [
    {
      mock: 'deals',
      screenshot: ((window.__resources||{}).screenDeals1) || 'screens/deals-1.png',
      focusY: 0,           // top of screenshot: hero + savings + categories
      title: 'Find the best deals every week.',
      body: "Prox surfaces this week's price drops at every store near you, ranked by how much you save.",
      tint: '#FCE7BE', accent: '#8B6A00',

      mock: 'compare',
      screenshot: ((window.__resources||{}).screenDeals2) || 'screens/deals-2.png',
      focusY: 62,          // middle of screenshot: comparison table
      title: 'Compare stores side by side.',
      body: 'See the same item priced across Target, Walmart, and more. The cheapest store gets the check.',
      tint: '#D7EFE3', accent: '#175C43',
    },
    {
      mock: 'pantry',
      screenshot: ((window.__resources||{}).screenPantry) || 'screens/pantry.png',

      body: 'Track what is in your pantry so Prox quietly avoids duplicates and flags items before they expire.',

    },
  ];

  const total = features.length;
  const [idx, setIdx] = React.useState(0);
  const [dir, setDir] = React.useState('next'); // controls slide direction
  const isLast = idx === total - 1;

  const advance = () => {
    if (isLast) { onContinue?.(); return; }
    setDir('next');
    setIdx(i => i + 1);
  };
  const back = () => {
    if (idx === 0) { onBack?.(); return; }
    setDir('back');
    setIdx(i => i - 1);
  };
  const skip = () => onContinue?.();

  return (
    <ScreenShell bg="#F4EBDD">
      <div style={{
        flex: 1, display: 'flex', flexDirection: 'column',
        padding: '68px 20px 0', minHeight: 0,

// Phone-shaped container that frames the in-app screenshot.
// focusY (0–100) controls which vertical slice of the screenshot is
// shown via object-position. The container aspect is wider than the
// raw iPhone screenshot so cover-cropping naturally highlights a
// horizontal band of the source image.
function PhoneScreenshot({ src, focusY = 0, accent = '#175C43' }) {
  return (
    <div style={{
      position: 'absolute', inset: 0,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      padding: 16,
    }}>
      <div style={{
        position: 'relative',
        height: '100%',
        // Phone-screenshot proportions framed slightly wider so we can
        // crop to specific app sections via object-position.
        aspectRatio: '210 / 320',
        background: '#fff',
        borderRadius: 18,
        overflow: 'hidden',
        boxShadow: '0 12px 28px rgba(33,27,22,0.18), 0 0 0 1px rgba(33,27,22,0.08)',
      }}>
        <img
          src={src}
          alt=""
          style={{
            width: '100%', height: '100%',
            objectFit: 'cover',
            objectPosition: `50% ${focusY}%`,
            display: 'block',
          }}
        />
        {/* subtle inner highlight ring */}
        <span style={{
          position: 'absolute', inset: 0, borderRadius: 18,
          boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.6)',
          pointerEvents: 'none',
        }}/>
      </div>
    </div>
  );
}

//   • Count-up animation on $$ amount when slider changes

//   • Sparkle icon next to savings number
// ─────────────────────────────────────────────────────────────
function Screen6_SavingsPreview({ onBack, onContinue }) {
  const [spend, setSpend] = React.useState(200);

function Screen7_Building({ onReady, firstName = '', stores = ['Ralphs','Walmart','Costco','Whole Foods'] }) {
  const [progress, setProgress] = React.useState(0);
  const [notif, setNotif] = React.useState('idle'); // 'idle' | 'asking' | 'allowed' | 'denied'

    const start = performance.now();
    const dur = 9000;

      const p = Math.min(1, (t - start) / dur);
      const eased = 1 - Math.pow(1 - p, 2);
      setProgress(eased);
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [onReady]);

    const t = setInterval(() => setPhase(p => (p + 1) % 3), 3200);

}

// ─────────────────────────────────────────────────────────────
// SCREEN (QUEUE-ONLY) — FOUNDING MEMBER WELCOME
//   Celebration after the queue clears. A membership "card" with a
//   member number + perks. Pairs with the queue approach.
// ─────────────────────────────────────────────────────────────
function ScreenFoundingMember({ onReady, onContinue, firstName = '' }) {

  React.useEffect(() => {
    const tm = setTimeout(() => setConfetti(false), 2200);

  const advance = onContinue || onReady;

  const perks = [

  return (
    <ScreenShell bg="#F4EBDD">
      <div style={{
        flex: 1, position: 'relative',
        display: 'flex', flexDirection: 'column',
        padding: '68px 22px 0', minHeight: 0, overflow: 'hidden',
      }}>
        {confetti && <Confetti duration={2000} count={32}/>}

        <div style={{
          flex: 1, minHeight: 0,
          display: 'flex', flexDirection: 'column', justifyContent: 'center',

        }}>

          <div style={{
            background: 'linear-gradient(150deg, #1B6B4F 0%, #0E3F2C 100%)',
            borderRadius: 20, padding: '18px 18px 16px', color: '#fff',

            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>

                  <img src={PROX_ASSETS.logo} alt="" style={{ width: 26, height: 26, objectFit: 'cover' }}/>

                <span style={{

              <svg width="18" height="18" viewBox="0 0 24 24" fill="#F2CF58" stroke="none">

              fontFamily: 'Nunito, system-ui, sans-serif',
              fontSize: 10, fontWeight: 900, color: '#F2CF58',
              letterSpacing: '0.18em', textTransform: 'uppercase', marginTop: 22,

            <div style={{
              fontFamily: 'Nunito, system-ui, sans-serif',
              fontSize: 22, fontWeight: 900, letterSpacing: '-0.01em', marginTop: 2,

            <div style={{
              display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', marginTop: 14,
            }}>
              <div>
                <div style={{
                  fontFamily: 'Nunito, system-ui, sans-serif',
                  fontSize: 9.5, fontWeight: 800, color: 'rgba(255,255,255,0.6)',

                  fontFamily: 'Nunito, system-ui, sans-serif',

                <div style={{

          <h1 style={{
            fontFamily: 'Nunito, system-ui, sans-serif',
            fontSize: 24, fontWeight: 900, color: '#211B16',
            margin: '18px 0 0', lineHeight: 1.1, letterSpacing: '-0.02em',
          }}>You're on the inside.</h1>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 9, marginTop: 12 }}>
            {perks.map((p, i) => (
              <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>

  </script>

  <script type="text/babel">

const SCREENS = [
  { id: 0,  label: '01 Splash',            comp: 'Screen0_Splash' },
  { id: 1,  label: '02 Welcome',           comp: 'Screen1_Welcome' },
  { id: 2,  label: '03 Create Account',    comp: 'Screen2_SignUp' },
  { id: 3,  label: '04 Verify Email',      comp: 'Screen3_VerifyEmail' },
  { id: 4,  label: '05 Choose Stores',     comp: 'Screen4_Stores' },
  { id: 5,  label: '06 Food Preferences',  comp: 'Screen5_FoodPrefs' },
  { id: 6,  label: '07 Feature Reveal',    comp: 'Screen6_FeatureReveal' },
  { id: 7,  label: '08 Savings Preview',   comp: 'Screen7_SavingsPreview' },
  { id: 8,  label: '09 Location Access',   comp: 'Screen9_Location' },
  { id: 9,  label: '10 Building Prox',     comp: 'Screen10_BuildingProx' },
  { id: 10, label: '11 Notification Echo', comp: 'Screen12_NotificationEcho' },
  { id: 11, label: '12 Deals Ready',       comp: 'Screen13_DealsReady' },
];

function ProxApp() {
  const [idx, setIdx] = React.useState(0);
  const [email, setEmail] = React.useState('jamie@example.com');
  const [firstName, setFirstName] = React.useState('Jamie');
  const [zip, setZip] = React.useState('30308');

  const next = () => setIdx(i => Math.min(i + 1, SCREENS.length - 1));
  const prev = () => setIdx(i => Math.max(i - 1, 0));
  const go = (i) => setIdx(Math.max(0, Math.min(i, SCREENS.length - 1)));

  const renderScreen = (screenIdx) => {
    const s = SCREENS[screenIdx];
    const C = window[s.comp];
    if (!C) return (
      <div style={{ padding: 24, color: '#211B16', fontFamily: 'Nunito, sans-serif' }}>
        <h3 style={{ fontSize: 18, fontWeight: 800 }}>{s.label}</h3>
        <p style={{ marginTop: 8, color: 'rgba(33,27,22,0.6)' }}>Screen component ready</p>
        <button onClick={next} style={{ marginTop: 16, padding: '10px 18px', background: '#175C43', color: '#fff', border: 'none', borderRadius: 999, fontWeight: 700, cursor: 'pointer' }}>Continue</button>
      </div>
    );
    const passProps = {
      onNext: () => next(),
      onBack: () => prev(),
      onSkip: () => next(),
      onGetStarted: () => next(),
      onSignUp: (d) => {
        if (d?.email) setEmail(d.email);
        if (d?.firstName) setFirstName(d.firstName);
        if (d?.zip) setZip(d.zip);
        next();
      },
      onVerify: () => next(),
      onSelectStores: () => next(),
      onSelectPrefs: () => next(),
      onContinue: () => next(),
      onTap: () => next(),
      onAllow: () => next(),
      onOpen: () => {
        setIdx(0);
      },
      email, firstName, zip,
      defaultZip: zip,
      buildMode: 'honest'
    };
    return <C {...passProps}/>;
  };

  return (
    <div style={{
      minHeight: '100vh',
      display: 'flex',
      flexDirection: 'column',
      alignItems: 'center',
      justifyContent: 'center',
      background: 'radial-gradient(circle at 50% 35%, #1a422b 0%, #0c2014 60%, #06110a 100%)',
      fontFamily: 'Nunito, system-ui, -apple-system, sans-serif',
      padding: '24px 16px',
      boxSizing: 'border-box',
    }}>
      {/* Centered iPhone device */}
      <div style={{ position: 'relative', display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
        <div style={{
          boxShadow: '0 35px 80px -20px rgba(0,0,0,0.8), 0 0 100px -20px rgba(23,92,67,0.4)',
          borderRadius: 54,
        }}>
          <IOSDevice width={385} height={775}>
            {renderScreen(idx)}
          </IOSDevice>
        </div>

        {/* Minimal floating navigation pill below phone */}
        <div style={{
          marginTop: 20,
          display: 'inline-flex',
          alignItems: 'center',
          gap: 12,
          background: 'rgba(255, 255, 255, 0.08)',
          backdropFilter: 'blur(16px)',
          border: '1px solid rgba(255, 255, 255, 0.12)',
          borderRadius: 999,
          padding: '6px 16px',
          color: '#F4EBDD',
          boxShadow: '0 8px 30px rgba(0,0,0,0.4)',
          userSelect: 'none',
        }}>
          <button onClick={prev} disabled={idx === 0}
            style={{
              background: 'transparent', border: 'none', color: idx === 0 ? 'rgba(244,235,221,0.25)' : '#F4EBDD',
              cursor: idx === 0 ? 'default' : 'pointer', fontSize: 18, fontWeight: 800, padding: '0 6px', lineHeight: 1,
            }}>‹</button>

          <span style={{ fontSize: 12, fontWeight: 700, letterSpacing: '0.04em', color: 'rgba(244,235,221,0.9)' }}>
            {idx + 1} of {SCREENS.length} · {SCREENS[idx].label.replace(/^\d+\s*/, '')}
          </span>

          <button onClick={next} disabled={idx === SCREENS.length - 1}
            style={{
              background: 'transparent', border: 'none', color: idx === SCREENS.length - 1 ? 'rgba(244,235,221,0.25)' : '#F4EBDD',
              cursor: idx === SCREENS.length - 1 ? 'default' : 'pointer', fontSize: 18, fontWeight: 800, padding: '0 6px', lineHeight: 1,
            }}>›</button>

          <button onClick={() => go(0)} title="Restart from beginning"
            style={{
              marginLeft: 6, background: 'rgba(242, 207, 88, 0.18)', border: '1px solid rgba(242, 207, 88, 0.35)',
              color: '#F2CF58', borderRadius: 999, padding: '2px 10px', fontSize: 10, fontWeight: 800, cursor: 'pointer',
              letterSpacing: '0.04em', textTransform: 'uppercase',
            }}>Reset</button>
        </div>
      </div>
    </div>
  );
}

window.ProxApp = ProxApp;

  </script>

  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ProxApp />);
  </script>
</body>
</html>
